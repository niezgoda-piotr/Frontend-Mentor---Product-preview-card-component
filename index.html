<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Piotr Niezgoda">
    <meta name="description" content="Frontend Mentor | Product preview card component">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
    <main>
        <article class="product">
            <picture>
                <source media="screen and (width < 550px)" srcset="./images/image-product-mobile.jpg" width="350px">
                <source media="screen and (width >= 550px)" srcset="./images/image-product-desktop.jpg" width="480px">
                <img src="./images/image-product-mobile.jpg" alt="Bottle of perfume">
            </picture>
            <div class="product-info">
                <section class="product-description">
                    <p class="product-description__category">Perfume</p>
                    <h1 class="product-description__name">Gabrielle Essence Eau De Parfum</h1>
                    <p class="product-description__description">
                        A floral, solar and voluptuous interpretation composed by Olivier Polge,
                        Perfumer-Creator for the House of CHANEL.
                    </p>
                </section>
                <section class="product-shopping">
                    <div class="product-shopping__price">
                        <span>$149.99</span><span class="product-shopping__price--old">$169.99</span>
                    </div>
                    <button type="button" class="product-shopping__add-to-cart-but">
                        <span class="icon">
                            <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg"><path
                                    d="M14.383 10.388a2.397 2.397 0 0 0-1.518-2.222l1.494-5.593a.8.8 0 0 0-.144-.695.8.8 0 0 0-.631-.28H2.637L2.373.591A.8.8 0 0 0 1.598 0H0v1.598h.983l1.982 7.4a.8.8 0 0 0 .799.59h8.222a.8.8 0 0 1 0 1.599H1.598a.8.8 0 1 0 0 1.598h.943a2.397 2.397 0 1 0 4.507 0h1.885a2.397 2.397 0 1 0 4.331-.376 2.397 2.397 0 0 0 1.12-2.021ZM11.26 7.99H4.395L3.068 3.196h9.477L11.26 7.991Zm-6.465 6.392a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Zm6.393 0a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Z"
                                    fill="#FFF"/></svg>
                        </span>
                        <span>Add to Cart</span>
                    </button>
                </section>
            </div>
        </article>
    </main>
</body>
</html>
